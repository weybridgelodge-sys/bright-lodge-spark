workflows:
  ios-workflow:
    name: Weybridge Lodge Portal - iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: weybridge_lodge_asc
    environment:
      groups:
        - app_store_credentials
      vars:
        BUNDLE_ID: "uk.org.weybridgelodge.portal"
        XCODE_SCHEME: "App"
        XCODE_PROJECT: "ios/App/App.xcodeproj"
      node: 22
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install Bun
        script: |
          curl -fsSL https://bun.sh/install | bash
          ls -la $HOME/.bun/bin/
          sudo ln -sf $HOME/.bun/bin/bun /usr/local/bin/bun
          bun --version
      - name: Install dependencies
        script: |
          bun install --frozen-lockfile
      - name: Build web assets
        script: |
          bun run build
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: TEMP - Generate certificate private key
        script: |
          openssl genrsa -out /tmp/ios_distribution_private_key.pem 2048
          echo "===COPY THE SINGLE LONG LINE BELOW==="
          base64 -i /tmp/ios_distribution_private_key.pem | tr -d '\n'
          echo ""
          echo "===END COPY==="
      - name: Fetch signing files
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > /tmp/certificate_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:/tmp/certificate_key.pem" \
            --create
      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates
      - name: Set up code signing
        script: |
          xcode-project use-profiles
      - name: Set build number (monotonic timestamp)
        script: |
          #!/bin/sh
          set -e
          cd $CM_BUILD_DIR/ios/App
          BUILD_NUMBER=$(date +%s)
          echo "Setting CFBundleVersion to $BUILD_NUMBER"
          agvtool new-version -all "$BUILD_NUMBER"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
